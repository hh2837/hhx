[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xagent"
version = "0.1.0"
description = "核心与界面分离的多端 Agent 框架（当前内置 Textual TUI 前端）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "textual>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xagent = "tui.__main__:main"

[tool.setuptools]
packages = ["core", "core.agent", "core.llm", "core.tools", "tui", "tui.widgets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE", "PIE", "C4", "TID", "S"]
ignore = [
    "E501",    # 行宽由格式化工具负责
    "S101",    # assert 在测试中大量使用
    "SIM105",  # 允许使用 contextlib.suppress
    "RUF001",  # 中文文档中的全角标点是有意为之
    "RUF002",
    "RUF003",
    "TID252",  # 包内部统一使用相对导入，保持模块可移植
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S404", "S603", "S607"]
