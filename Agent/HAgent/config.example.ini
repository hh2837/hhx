[LLM]
; OpenAI 兼容接口地址（LM Studio / Ollama / vLLM / DeepSeek …）
base_url = http://localhost:1234/v1
; API Key；也可以通过环境变量 XAGENT_LLM_API_KEY 注入，避免写进文件
api_key =
model = DeepSeek V4.1 Flash
timeout = 120
temperature = 0.7

[Agent]
system_prompt = 你是一个命令行助手，拥有本地文件系统与时间相关的工具能力。回答要简洁、准确，必要时主动调用工具获取真实信息，不要臆造。
max_tool_rounds = 8
max_history_messages = 200

[Filesystem]
; 留空表示以工作目录（workspace）为沙箱根目录；填绝对路径则限制在该目录内
root =
encoding = utf-8
max_read_bytes = 512000

[UI]
theme = textual-dark
show_sidebar = true
sidebar_width = 42
